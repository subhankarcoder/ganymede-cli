name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'manifests/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Vet
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Go Module
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Build for Windows (${{ matrix.goarch }})
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -trimpath -ldflags="-H=windowsgui -s -w -X 'ganymede-cli/banner.Version=ci-test'" -o bin/ganymede.exe .
