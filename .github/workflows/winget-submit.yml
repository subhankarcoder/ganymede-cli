name: Submit to WinGet (Initial & Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to submit (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      token:
        description: 'GitHub Classic PAT (ghp_...) with public_repo (optional if WINGET_TOKEN secret is set)'
        required: false
        default: ''

jobs:
  submit:
    name: Submit Manifests to microsoft/winget-pkgs
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"

      - name: Submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $inputToken = "${{ github.event.inputs.token }}"
          $token = if (-not [string]::IsNullOrWhiteSpace($inputToken)) { $inputToken } else { $env:WINGET_TOKEN }

          if ([string]::IsNullOrWhiteSpace($token)) {
            Write-Error "No GitHub token found! Please either enter your Classic PAT when running the workflow or save WINGET_TOKEN in Repository Settings -> Secrets and variables -> Actions."
          }

          if ($token.StartsWith("github_pat_")) {
            Write-Warning "Detected fine-grained token ('github_pat_...'). Note that fine-grained tokens cannot create forks of 'microsoft/winget-pkgs'. If this step fails with an authorization error, use a Classic PAT ('ghp_...') with 'public_repo' scope."
          }

          $ver = "${{ github.event.inputs.version }}"
          $manifestPath = "manifests/e/ebsglobal/ganymede/$ver"
          Write-Host "Submitting manifests from: $manifestPath"

          $env:WINGET_CREATE_GITHUB_TOKEN = $token
          .\wingetcreate.exe submit "$manifestPath" --token "$token" --prtitle "New package: ebsglobal.ganymede version $ver"
