name: Submit to WinGet (Initial & Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to submit (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  submit:
    name: Submit Manifests to microsoft/winget-pkgs
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          .\wingetcreate.exe --version

      - name: Submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Error "WINGET_TOKEN secret is not set in repository secrets! Please add a Classic Personal Access Token with 'public_repo' scope."
          }
          $ver = "${{ github.event.inputs.version }}"
          $manifestPath = "manifests/s/subhankarcoder/ganymede/$ver"
          Write-Host "Submitting manifests from: $manifestPath"
          .\wingetcreate.exe submit "$manifestPath" --token "$env:WINGET_TOKEN"
